<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Zallu — pre-consultation summary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Jost:wght@500;600&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#14102A;--cream:#FBF7F1;--bone:#F6F1E8;--brass:#C9A96A;--slate:#5C566E;--rule:#EEEAF0;--edge:rgba(20,16,42,.16);
--red:#B42318;--redEdge:#7E1710;--redTint:#FBEAE7;--amber:#8A4B00;--amberEdge:#5C3200;--amberTint:#FBEEDC;--green:#16704A;--greenEdge:#0C4A2F}
*{box-sizing:border-box}html,body{margin:0;background:var(--cream);color:var(--ink);font:16px/1.45 "Nunito Sans",system-ui,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:20px 20px 64px}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px}
header svg{height:34px;width:auto}
.btn{font:600 14px/1 Jost,sans-serif;letter-spacing:.3px;border:0;border-radius:999px;padding:0 20px;height:44px;background:#fff;color:var(--ink);box-shadow:0 3px 0 var(--edge);cursor:pointer}
.btn.primary{background:var(--ink);color:#fff;box-shadow:0 3px 0 #080614}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:600;margin:0}
h1{font-size:22px;line-height:1.25}h2{font-size:17px;margin-bottom:10px}
.eyebrow{font:500 11px/1.3 Jost,sans-serif;letter-spacing:2.2px;text-transform:uppercase;color:var(--slate)}
.card{background:#fff;border-radius:24px;padding:18px 20px;box-shadow:0 4px 0 var(--edge);margin-bottom:16px}
.ref{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap}
.code{font:600 20px/1.2 Jost,sans-serif;letter-spacing:1.2px;font-variant-numeric:tabular-nums}
.meta{color:var(--slate);font-size:14px}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--brass);margin-right:6px;vertical-align:middle}
.line{display:grid;grid-template-columns:26px 1fr;gap:12px;padding:10px 0;border-top:2px solid var(--rule)}.line:first-of-type{border-top:0}
.line .m{font-family:Fraunces,serif;font-weight:600;font-size:16px;color:var(--ink)}.line .m.f{color:var(--brass)}
.line .v{font-size:15px}.flag{color:var(--ink);font-weight:800}
.pills{display:flex;flex-wrap:wrap;gap:8px}.pill{border-radius:999px;padding:6px 14px;font-size:14px;font-weight:800;background:#fff;border:1px solid #E4DFE6;box-shadow:0 3px 0 var(--edge)}
.pill.sev{background:var(--red);color:#fff;border-color:var(--red);box-shadow:0 3px 0 var(--redEdge)}.pill small{font-weight:400;color:var(--slate);display:block;font-size:12px}.pill.sev small{color:#fff}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:6px 16px;font-size:15px}.kv .k{color:var(--slate)}.kv .v{font-weight:600}
details{border-top:2px solid var(--rule);padding-top:12px}summary{cursor:pointer;font-family:Fraunces,serif;font-weight:600;font-size:16px}
.note{border-radius:16px;padding:12px 14px;background:#fff;box-shadow:0 4px 0 var(--edge);margin-top:10px;font-size:15px}
.tag{display:inline-block;font:500 12px/1 Jost,sans-serif;letter-spacing:.6px;border:2px solid;border-radius:999px;padding:6px 10px;margin-bottom:8px}
.reported{border-left:6px solid var(--brass)}.rep{margin:8px 0 10px;padding-left:20px}.rep li{margin:4px 0;font-size:16px;font-weight:600;color:var(--ink)}
.disc{font-size:13px;color:var(--slate);margin-top:24px}
.err{text-align:center;padding:48px 0}
@media print{body{background:#fff}.wrap{max-width:none;padding:0}.btn{display:none}.card{box-shadow:none;border:1px solid #ddd;break-inside:avoid}details{display:block}details>*{display:block}}
</style>
</head>

(function(){
